# The Xcode project for Sakamoto Voice, the iPhone app, generated by XcodeGen:
#
#     cd ios && xcodegen generate
#
# SakamotoVoice.xcodeproj is generated and git-ignored; change this file instead.
# (scripts/build.sh generates it before building.)

name: SakamotoVoice

options:
  bundleIdPrefix: com.pragmaphilia
  # iOS 18, not 26: the stand's iPhone XS can't run iOS 26 (its last is iOS 18), and the app needs
  # nothing newer.
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: 7
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES

packages:
  SakamotoVoiceKit:
    path: SakamotoVoiceKit

targets:
  SakamotoVoice:
    type: application
    platform: iOS
    sources:
      - path: SakamotoVoice
    info:
      path: SakamotoVoice/Info.plist
      properties:
        CFBundleDisplayName: Sakamoto Voice
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 Pragmaphilia Labs."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Upright or sideways on the stand.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The receiver: a TCP listener advertised with Bonjour.
        NSLocalNetworkUsageDescription: >-
          Sakamoto Voice listens on your local network for Claude's responses from your Mac, to
          speak them aloud.
        NSBonjourServices:
          - _sakamotovoice._tcp
        # Speech in the background, and the keep-alive sound that keeps the listener running.
        UIBackgroundModes:
          - audio
    dependencies:
      - package: SakamotoVoiceKit
        product: SakamotoVoiceKit
    settings:
      base:
        PRODUCT_NAME: SakamotoVoice
        PRODUCT_BUNDLE_IDENTIFIER: com.pragmaphilia.SakamotoVoice
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        # SakamotoVoice/AppIcon.icon, an Icon Composer document (two glowing layers on a dark fill)
        # written by scripts/make-icon.py: Xcode compiles it into Assets.car, lit by iOS 26 (default,
        # dark, tinted, and clear) and flattened into ordinary icon images for iOS 18.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  # Building builds the app; testing runs SakamotoVoiceKit's unit tests, which need no host app,
  # so testing never launches Sakamoto Voice:
  #
  #     xcodebuild -project SakamotoVoice.xcodeproj -scheme SakamotoVoice -destination 'platform=iOS Simulator,name=iPhone 17' test
  SakamotoVoice:
    build:
      targets:
        SakamotoVoice: all
    test:
      targets:
        - package: SakamotoVoiceKit/SakamotoVoiceKitTests
    run:
      config: Debug
    archive:
      config: Release
