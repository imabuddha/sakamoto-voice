# The Xcode project for Sakamoto Voice, the iPhone app and its Apple Watch app, generated by
# XcodeGen:
#
#     cd ios && xcodegen generate
#
# SakamotoVoice.xcodeproj is generated and git-ignored; change this file instead.
# (scripts/build.sh generates it before building.)

name: SakamotoVoice

options:
  bundleIdPrefix: com.pragmaphilia
  # iOS 18, not 26: the stand's iPhone XS can't run iOS 26 (its last is iOS 18), and the app needs
  # nothing newer. watchOS 11 is the watchOS that pairs with iOS 18 (the same watches as watchOS
  # 26: Series 6 and later, SE 2nd generation, every Ultra), and the watch app needs nothing newer.
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    # The watch app has the iPhone app's version and build, as an embedded watch app must.
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: 10
    # The iPhone app's bundle ID; the watch app's is this plus ".watchkitapp". Use your own.
    APP_BUNDLE_ID: com.pragmaphilia.SakamotoVoice
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES

packages:
  SakamotoVoiceKit:
    path: SakamotoVoiceKit

targets:
  SakamotoVoice:
    type: application
    platform: iOS
    sources:
      - path: SakamotoVoice
    info:
      path: SakamotoVoice/Info.plist
      properties:
        CFBundleDisplayName: Sakamoto Voice
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 Pragmaphilia Labs."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Upright or sideways on the stand.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The receiver: a TCP listener advertised with Bonjour.
        NSLocalNetworkUsageDescription: >-
          Sakamoto Voice listens on your local network for Claude's responses from your Mac, to
          speak them aloud.
        NSBonjourServices:
          - _sakamotovoice._tcp
        # Speech in the background, and the keep-alive sound that keeps the listener running.
        UIBackgroundModes:
          - audio
    dependencies:
      - package: SakamotoVoiceKit
        product: SakamotoVoiceKit
      # Embedded in the app's Watch folder; installing the app offers it to a paired watch.
      - target: SakamotoVoiceWatch
    settings:
      base:
        PRODUCT_NAME: SakamotoVoice
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        # SakamotoVoice/AppIcon.icon, an Icon Composer document (two glowing layers on a dark fill)
        # written by scripts/make-icon.py: Xcode compiles it into Assets.car, lit by iOS 26 (default,
        # dark, tinted, and clear) and flattened into ordinary icon images for iOS 18.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # The Apple Watch app (one target, SwiftUI): the messages the phone mirrors to it, read aloud on
  # the watch. It needs no background mode: it speaks only while in front.
  SakamotoVoiceWatch:
    type: application
    platform: watchOS
    sources:
      - path: SakamotoVoiceWatch
      # The phone's icon: an Icon Composer document serves a watch app too.
      - path: SakamotoVoice/AppIcon.icon
    info:
      path: SakamotoVoiceWatch/Info.plist
      properties:
        CFBundleDisplayName: Sakamoto Voice
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 Pragmaphilia Labs."
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
    dependencies:
      - package: SakamotoVoiceKit
        product: SakamotoVoiceKit
    settings:
      base:
        PRODUCT_NAME: SakamotoVoiceWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  # Building builds the app; testing runs SakamotoVoiceKit's unit tests, which need no host app,
  # so testing never launches Sakamoto Voice:
  #
  #     xcodebuild -project SakamotoVoice.xcodeproj -scheme SakamotoVoice -destination 'platform=iOS Simulator,name=iPhone 17' test
  SakamotoVoice:
    build:
      targets:
        SakamotoVoice: all
    test:
      targets:
        - package: SakamotoVoiceKit/SakamotoVoiceKitTests
    run:
      config: Debug
    archive:
      config: Release
  # The watch app alone (scripts/build.sh watch).
  SakamotoVoiceWatch:
    build:
      targets:
        SakamotoVoiceWatch: all
    run:
      config: Debug
    archive:
      config: Release
